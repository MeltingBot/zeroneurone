# Security headers, included in every location block.
#
# nginx does not merge add_header across levels: a block that declares any
# add_header of its own inherits none from its parent, "always" included.
# Every location here sets Cache-Control, so a server-level declaration of
# these headers would never reach a single response. Hence the include.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://tile.openstreetmap.org https://*.tile.openstreetmap.fr https://*.tile.openstreetmap.de https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://s3.amazonaws.com https://tiles.openfreemap.org; connect-src 'self' https://nominatim.openstreetmap.org wss: ws:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self';" always;
