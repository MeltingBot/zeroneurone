# Security headers, included in every location block.
#
# nginx does not merge add_header across levels: a block that declares any
# add_header of its own inherits none from its parent, "always" included.
# Every location here sets Cache-Control, so a server-level declaration of
# these headers would never reach a single response. Hence the include.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

# Content-Security-Policy.
#
# What this policy defends against is script execution: script-src without
# 'unsafe-inline' and without 'unsafe-eval', object-src 'none', base-uri and
# frame-ancestors. That is the part worth having.
#
# connect-src, img-src and media-src are deliberately broad. ZeroNeurone is
# extensible, and its plugins talk to endpoints the user configures: a custom
# S3 or WebDAV endpoint (VaultNeurone), an LLM API key (OneNeurone reaches
# Mistral, OpenAI, Anthropic or HuggingFace), a GoNeurone backend, the RPUC
# proxy (SpotNeurone). An allowlist cannot enumerate addresses the user picks,
# and narrowing it would break those features without buying much: a plugin is
# imported from a blob URL and runs in the main realm (see pluginSandbox), so
# it already holds unrestricted fetch. A strict connect-src here would be a
# false assurance paid for with broken functionality.
#
# 'blob:' in script-src and worker-src is required by the plugin loader and by
# the WebLLM workers. 'wasm-unsafe-eval' is required too: once script-src is
# set at all, Chrome refuses WebAssembly.compile without it, which would break
# ForeNeurone (SQLite via sql.js) and OneNeurone (WebLLM). It permits wasm
# compilation only, not eval() of JavaScript.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https: wss: ws:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
