server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Hashed assets (immutable cache) - Vite adds 8-char hashes like .a1b2c3d4.js
    location ~* "-[a-zA-Z0-9_-]+\.(js|css|woff2?)$" {
        expires max;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Static assets
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|webm|mp4|pdf|wasm)$ {
        expires 1h;
        add_header Cache-Control "public";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Security headers live in security-headers.conf and are included by each
    # location above. Declaring them here would be silently dropped: every
    # location sets its own add_header, and nginx then inherits none.
    include /etc/nginx/conf.d/security-headers.conf;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
}
